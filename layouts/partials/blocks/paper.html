{{/*
  Publications block.
  Content comes from data/papers.yaml (papers without `highlight: true`).
  Optional block option in content/_index.md:  content.title  (default "Publications")
  Visual styling lives in assets/scss/styles/<style>.scss - keep this file style-agnostic.
*/}}
{{ $page := .wcPage }}
{{ $block := .wcBlock }}
{{ $data := site.Data.papers }}
{{ if not $data }}{{ errorf "data/papers.yaml not found or empty" }}{{ end }}
{{ $title := $block.content.title | default "Publications" }}

<div class="col-12 pub-block pub-block--all js-paper-filter-block">
    <div class="section-heading pub-heading justify-content-around d-flex exp-title text-muted my-0">
        <h1 class="mb-4">{{ $title | safeHTML }}</h1>
    </div>
      <span class="paper-filter-label">Filter:</span>
    <div class="paper-filter-controls d-flex justify-content-center mb-4" role="toolbar" aria-label="Filter publications by content group">
      <div class="btn-group btn-group-sm flex-wrap" role="group" aria-label="Publication groups">
        <button type="button" class="btn btn-outline-primary active" data-paper-filter="all" aria-pressed="true">All</button>
        {{- range $data.groups }}
        <button type="button" class="btn btn-outline-primary" data-paper-filter="{{ .id }}" aria-pressed="false">{{ .label }}</button>
        {{- end }}
      </div>
    </div>
    {{- range $data.papers }}
    {{- if not .highlight }}
    {{ partial "pub/card.html" . }}
    {{- end }}
    {{- end }}
</div>

<script>
(function () {
  function updateButtonState(buttons, activeFilter) {
    Array.prototype.forEach.call(buttons, function (button) {
      var isActive = button.getAttribute("data-paper-filter") === activeFilter;
      button.classList.toggle("active", isActive);
      button.setAttribute("aria-pressed", isActive ? "true" : "false");
    });
  }

  function applyFilter(cards, filterName) {
    Array.prototype.forEach.call(cards, function (card) {
      var shouldShow = filterName === "all" || card.classList.contains(filterName);
      card.classList.toggle("paper-card-is-hidden", !shouldShow);
    });
  }

  function initializePaperFilters(root) {
    var buttons = root.querySelectorAll("[data-paper-filter]");
    var cards = root.querySelectorAll(".pub-card");

    if (!buttons.length || !cards.length) {
      return;
    }

    Array.prototype.forEach.call(buttons, function (button) {
      button.addEventListener("click", function () {
        var filterName = button.getAttribute("data-paper-filter") || "all";
        updateButtonState(buttons, filterName);
        applyFilter(cards, filterName);
        button.blur();
      });
    });

    updateButtonState(buttons, "all");
    applyFilter(cards, "all");
  }

  function bootPaperFilters() {
    var blocks = document.querySelectorAll(".js-paper-filter-block");

    Array.prototype.forEach.call(blocks, initializePaperFilters);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootPaperFilters);
  } else {
    bootPaperFilters();
  }
})();
</script>
