{{/*
  Highlight block.
  Content comes from data/papers.yaml (papers with `highlight: true`).
  Optional block option in content/_index.md:  content.title  (default "✨ Highlight ✨")
  Visual styling lives in assets/scss/styles/<style>.scss - keep this file style-agnostic.
*/}}
{{ $page := .wcPage }}
{{ $block := .wcBlock }}
{{ $data := site.Data.papers }}
{{ if not $data }}{{ errorf "data/papers.yaml not found or empty" }}{{ end }}
{{ $title := $block.content.title | default "&#10024 Highlight &#10024" }}

<div class="pub-block pub-block--highlight">
    <div class="section-heading pub-heading justify-content-around d-flex exp-title text-muted my-0">
        <h1 class="mb-4">{{ $title | safeHTML }}</h1>
    </div>

    <div class="card-deck mb-4">
      {{- range $data.papers }}
      {{- if .highlight }}
      {{ partial "pub/card.html" . }}
      {{- end }}
      {{- end }}
    </div>
</div>
